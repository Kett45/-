name: Publish Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Publish kAM Lite APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Signed APK if not present
        run: |
          mkdir -p releases
          if [ ! -f "releases/kAM-Lite.apk" ]; then
            curl -sSL "https://kappa.lol/miHUnS.apk" -o releases/kAM-Lite.apk
          fi
          ls -lh releases/kAM-Lite.apk

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "kAM Lite - أحدث نسخة للأندرويد (APK)"
          body: |
            ## 📲 تحميل تطبيق kAM Lite للأندرويد
            
            - **رابط التحميل الفوري المباشر (بضغطة واحدة):** https://kappa.lol/miHUnS.apk
          draft: false
          prerelease: false
          files: |
            releases/kAM-Lite.apk
